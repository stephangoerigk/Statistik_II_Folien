<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Arial, sans-serif">
  <rect width="560" height="300" fill="white"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#621C37">Moderationsmodell</text>

  <!-- Defs: arrowheads -->
  <defs>
    <marker id="arr-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#621C37"/>
    </marker>
    <marker id="arr-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#EE0071"/>
    </marker>
  </defs>

  <!-- X box -->
  <rect x="30" y="130" width="130" height="60" rx="10" fill="#621C37"/>
  <text x="95" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="white">X (UV)</text>
  <text x="95" y="176" text-anchor="middle" font-size="12" fill="#fdeef5">Prädiktor</text>

  <!-- Y box -->
  <rect x="400" y="130" width="130" height="60" rx="10" fill="#621C37"/>
  <text x="465" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Y (AV)</text>
  <text x="465" y="176" text-anchor="middle" font-size="12" fill="#fdeef5">Kriterium</text>

  <!-- Z box -->
  <rect x="215" y="38" width="130" height="60" rx="10" fill="#EE0071"/>
  <text x="280" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Z</text>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="white">Moderator</text>

  <!-- Arrow X → Y (main path) -->
  <line x1="163" y1="160" x2="397" y2="160" stroke="#621C37" stroke-width="2.5" marker-end="url(#arr-dark)"/>
  <text x="280" y="150" text-anchor="middle" font-size="13" fill="#621C37" font-style="italic">b₁</text>

  <!-- Arrow Z → midpoint of X→Y -->
  <line x1="280" y1="100" x2="280" y2="128" stroke="#EE0071" stroke-width="2.5" marker-end="url(#arr-pink)"/>
  <text x="295" y="130" text-anchor="start" font-size="13" fill="#EE0071" font-style="italic">b₃</text>

  <!-- Interaction label on the arrow -->
  <rect x="234" y="169" width="92" height="24" rx="5" fill="#fdeef5" stroke="#EE0071" stroke-width="1.2"/>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#EE0071" font-weight="bold">X · Z</text>

  <!-- Bottom note -->
  <rect x="30" y="220" width="500" height="62" rx="8" fill="#fdeef5" stroke="#621C37" stroke-width="1"/>
  <text x="280" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#621C37">Interpretation:</text>
  <text x="280" y="257" text-anchor="middle" font-size="11" fill="#333">Der Effekt von X auf Y (b₁) ist nicht konstant –</text>
  <text x="280" y="273" text-anchor="middle" font-size="11" fill="#333">er variiert in Abhängigkeit vom Wert des Moderators Z (b₃).</text>
</svg>
